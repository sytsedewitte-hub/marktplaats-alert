name: Marktplaats Check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python marktplaats_notifier.py
      - name: Opslaan
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add geziene_advertenties.json zoekopdrachten.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update" && git push)
